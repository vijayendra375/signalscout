name: SignalScout live 100-company smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "peak/judge-score-hardening"

# Keep at most one live crawl active for this branch. A newer candidate cancels
# an older run rather than multiplying requests to public source systems.
concurrency:
  group: signalscout-live-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peak/judge-score-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run live 100-company smoke test
        run: python scripts/smoke_100.py
        env:
          SIGNALSCOUT_GLOBAL_REQUEST_BUDGET: "2000"
          SIGNALSCOUT_RUN_DEADLINE_SECONDS: "2700"
      - name: Audit live output and run report
        run: |
          python scripts/audit_submission.py \
            --input data/smoke_100_companies.jsonl \
            --expected-count 100 \
            --output out/smoke_100_envelopes.jsonl \
            --report out/smoke_100_report.json
      - name: Upload live smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalscout-live-smoke-${{ github.run_id }}
          path: |
            out/smoke_100_report.json
            out/smoke_100_summary.md
            out/smoke_100_envelopes.jsonl
            out/smoke_100_dashboard.html
          if-no-files-found: warn
          retention-days: 14
